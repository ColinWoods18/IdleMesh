[package]
name = "idlemesh-agent"
version = "0.1.0"
edition = "2021"
description = "DIFA device agent: enrollment, capability probes, owner-policy enforcement, and heartbeats"
license = "UNLICENSED"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.33"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }

[profile.release]
strip = true
