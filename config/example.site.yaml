# IdleMesh site configuration (example).
#
# Copy this file, edit it for your site, and point the coordinator at it:
#   IDLEMESH_SITE_CONFIG=/path/to/site.yaml   or   python scripts/dev_server.py --site-config site.yaml
#
# Unknown keys are rejected, so a typo fails loudly instead of being ignored.
# Values marked (planned) are validated and stored now, and take effect in the sprint named.

site:
  org_id: example-university        # one organisation (a university, or a customer)
  site_id: main-campus              # one coordinator's site within it
  name: Example University, main campus

logging:                            # D-11
  level: info                       # error, warn, info, debug
  file: logs/coordinator.log        # relative to this file's directory; leave empty for console only
  max_mb: 10                        # rotate at this size
  keep: 5                           # rotated files to keep

telemetry:                          # D-11, privacy-office review pending (Sprints.md long-lead items)
  tier: operational                 # minimal | operational | research. research adds idle traces for the paper.
  interval_s: 60                    # how often nodes take an idle sample (sent to agents with each heartbeat)
  retention_days: 90                # idle samples and state changes older than this are deleted (hourly)
  pseudonymize_nodes: true          # telemetry is stored under a salted hash of the node ID (salt kept next to the database)

idle:                               # when a workstation counts as idle, and the governor's ramp (S4.9)
  idle_after_s: 600                 # no keyboard or mouse input for this long, or a locked session (applies now)
  ramp_s: 1800                      # contribution level rises from yield_level to 1.0 over this time (D-12)
  yield_level: 0.02                 # level a node drops to within about a second of user input (D-12)
  yield_within_ms: 1000             # (target; the agent checks input every second)

contribution:                       # contribution governor (S4.9); owners can only lower these on their machine
  max_memory_fraction: 0.5          # of the machine's RAM (planned: enrollment defaults, S10)
  max_cpu_fraction: 0.75            # worker threads at level 1.0, as a share of its configured threads
  allow_battery: false              # (planned: enrollment default, S10)
  windows:                          # time windows when nodes may contribute more (local time on the node)
    - name: overnight
      days: [mon, tue, wed, thu, fri, sat, sun]
      start: "20:00"
      end: "07:00"
      max_level: 1.0
    - name: daytime
      days: [mon, tue, wed, thu, fri]
      start: "07:00"
      end: "20:00"
      max_level: 0.5

probes:                             # network figures; most nodes are fixed desktops, so refresh rarely
  rtt_refresh_h: 24                 # applies now (S5.1): RTT is recorded on change, else this often
  rtt_change_pct: 50                # a change this large (and at least 1 ms) is recorded at once
  bandwidth_every_h: 168            # applies now (S5.2): the built-in bandwidth test through each tunnel, weekly
  bandwidth_off_hours_only: true    # the weekly refresh waits for off-hours; first tests and network changes do not
  off_hours_start: "20:00"          # coordinator local time; weekends are off-hours all day
  off_hours_end: "07:00"
  bandwidth_test_mb: 8              # MiB each way per test

clusters:                           # applies now (S5.4): which nodes share a network cluster
  max_rtt_ms: 5.0                   # median RTT at or below this joins two nodes
  min_mbps: 100                     # and bandwidth at or above this, once measured between nodes (peer probes)
  max_age_h: 72                     # figures older than this are ignored (3 x rtt_refresh_h)
  recompute_every_s: 300

fleet:                              # (planned, S8.9, D-12)
  min_active_nodes: 1
  max_active_nodes: 50
  warm_standbys: 1

queue:                              # applies now: the student fair queue
  per_user: 2                       # waiting requests per user
  total: 10                         # waiting requests across everyone
  active_generations: 1             # requests generating at once (grows with replicas, S7 and S8)
  wait_deadline_s: 600
  active_deadline_s: 300
