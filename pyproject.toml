[project]
name = "idlemesh-coordinator"
version = "0.1.0"
description = "IdleMesh coordinator (evolved from the DIFA prototype)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "argon2-cffi>=23.1",
  "httpx>=0.27",
  "cryptography>=42",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["coordinator"]

[tool.pytest.ini_options]
testpaths = ["coordinator/tests"]
pythonpath = ["coordinator"]
